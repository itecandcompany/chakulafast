<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c1440e" />
    <title>You're offline — ChakulaFast</title>
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <style>
      :root {
        --bg: #fffaf6;
        --fg: #1f1611;
        --muted: #6b5545;
        --primary: #c1440e;
        --card: #fff;
        --border: #e5d3c6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #241a15;
          --fg: #f7ede6;
          --muted: #c2ab9c;
          --primary: #ff9066;
          --card: #2e211a;
          --border: #4a3729;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family:
          Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 380px;
        text-align: center;
      }
      .badge {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 20px;
        background: var(--primary);
        color: #fff;
        font-size: 28px;
        font-weight: 700;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.25;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 24px;
        font-size: 15px;
        line-height: 1.5;
        color: var(--muted);
      }
      button {
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 14px;
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.99);
      }
      .hint {
        margin: 16px 0 0;
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">C</div>
      <h1>You're offline</h1>
      <p>
        ChakulaFast needs a connection to search for food near you. Any order you place will be sent
        as soon as you're back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
      <p class="hint">Check your mobile data or Wi-Fi and retry.</p>
    </main>
  </body>
</html>
